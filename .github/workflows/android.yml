name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'aether/**'
      - 'quiche/**'
      - '.github/workflows/android.yml'

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aether
      - name: Build Aether native core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: android/scripts/build-native.sh
      - name: Fetch verified tun2socks
        run: android/scripts/fetch-tun2socks.sh
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aether-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
